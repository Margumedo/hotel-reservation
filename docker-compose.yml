
services:
  db:
    image: postgres:15-alpine
    container_name: axd_db
    environment:
      POSTGRES_USER: admin_hotel
      POSTGRES_PASSWORD: Ma1c0l2026$
      POSTGRES_DB: hotel_Prod
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin_hotel", "-d", "hotel_Prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: axd_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin_hotel:Ma1c0l2026$@db:5432/hotel_Prod
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  db_data:
